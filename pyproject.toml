[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation"
version = "0.2.0"
description = "多平台電商對帳引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --doctest-modules --doctest-glob=''"
filterwarnings = ["error"]

# ----------------------------------------------------------------------
# mypy —— 領域層要求最嚴，因為那裡是正確性的核心
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true

# openpyxl 沒有提供型別資訊。它只在 platform_b 的 _load_rows 裡用到，
# 而且回傳值立刻經過 clean_cell() 收斂成 str，界線很窄。
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# Alembic 的 migration 腳本是由模板產生的，不做型別檢查
[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind-except
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 全形標點在中文註解裡是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# ImportFailed 與 NothingToReconcile 讀起來像句子，比 ImportFailedError
# 與 NothingToReconcileError 清楚。例外的命名慣例服務於可讀性，
# 不是反過來。
"src/reconciliation/services/*.py" = ["N818"]

[tool.coverage.run]
source = ["src/reconciliation"]
omit = ["*/legacy/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
