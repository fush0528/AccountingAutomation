[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation"
version = "0.2.0"
description = "多平台電商對帳引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --doctest-modules --doctest-glob=''"
filterwarnings = ["error"]

# ----------------------------------------------------------------------
# mypy —— 領域層要求最嚴，因為那裡是正確性的核心
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true

# openpyxl 沒有提供型別資訊。它只在 platform_b 的 _load_rows 裡用到，
# 而且回傳值立刻經過 clean_cell() 收斂成 str，界線很窄。
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind-except
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 全形標點在中文註解裡是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.coverage.run]
source = ["src/reconciliation"]
omit = ["*/legacy/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
