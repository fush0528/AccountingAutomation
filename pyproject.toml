[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation"
version = "0.2.0"
description = "多平台電商對帳引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]
# 只有在要把測試指向真的 PostgreSQL 時才需要。分成獨立的 extra 是刻意的：
# 預設的開發流程完全不需要 PostgreSQL，`pip install -e ".[dev]"` 就能跑全部測試。
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --doctest-modules --doctest-glob=''"

# 警告一律當成錯誤。這是刻意的——棄用警告是未來的 bug，
# 讓它現在就吵，比等到某天真的被移除才爆炸好。
#
# 例外必須逐條寫清楚，而且只比對訊息、不指定類別：指定類別的話，
# pytest 要 import 那個類別才能建立過濾器，而該類別在舊版 starlette
# 裡並不存在，會讓設定本身在舊環境壞掉。
filterwarnings = [
    "error",

    # --- 例外：第三方在 import 時就發出的遷移公告 ---------------------
    #
    # 下面兩條都是 `import starlette.testclient` 的當下就觸發的，
    # 而不是本專案呼叫了什麼過時的 API。它們有三個共同點：
    #   1. 發生在 import 階段，所以會讓整個 tests/api 在**收集**時就失敗，
    #      一個測試都還沒跑
    #   2. 我們無法在自己的程式裡修正——要等 FastAPI 上游跟進
    #   3. 純屬公告性質，沒有實際的行為風險
    #
    # 兩條都只比對訊息、不指定警告類別：指定類別的話 pytest 必須
    # import 那個類別才能建立過濾器，而 `StarletteDeprecationWarning`
    # 在舊版 starlette 裡並不存在，會讓設定本身在舊環境壞掉。
    # （實測過 starlette 1.0.0 與 1.6.0 兩種版本都通過。）
    #
    # 上游遷移完成後這兩條就該刪掉。刪掉之後測試若仍然通過，
    # 就代表問題真的沒了。
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:",
]

# ----------------------------------------------------------------------
# mypy —— 領域層要求最嚴，因為那裡是正確性的核心
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true

# openpyxl 沒有提供型別資訊。它只在 platform_b 的 _load_rows 裡用到，
# 而且回傳值立刻經過 clean_cell() 收斂成 str，界線很窄。
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# Alembic 的 migration 腳本是由模板產生的，不做型別檢查
[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind-except
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 全形標點在中文註解裡是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# ImportFailed 與 NothingToReconcile 讀起來像句子，比 ImportFailedError
# 與 NothingToReconcileError 清楚。例外的命名慣例服務於可讀性，
# 不是反過來。
"src/reconciliation/services/*.py" = ["N818"]

[tool.coverage.run]
source = ["src/reconciliation"]
omit = ["*/legacy/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
